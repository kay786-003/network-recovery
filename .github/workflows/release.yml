name: Publish versioned release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Prepare and validate release
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid version tag.' }
          .\release.ps1 -Version $env:RELEASE_TAG.Substring(1)
      - name: Publish preview release and assets
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $folder = Join-Path 'dist\releases' $env:RELEASE_TAG
          $assets = @(Get-ChildItem -LiteralPath $folder -File | Where-Object { $_.Name -ne 'RELEASE_NOTES.md' } | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --verify-tag --prerelease --title "Network Recovery $env:RELEASE_TAG" --notes-file (Join-Path $folder 'RELEASE_NOTES.md')
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
